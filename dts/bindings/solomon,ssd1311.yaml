description: SSD1311 LCD

compatible: "solomon,ssd1311"

include: [auxdisplay-device.yaml]

properties:
  font-width:
    type: int
    required: false
    description: Font width
    enum:
      - 5
      - 6

  invert-cursor:
    type: boolean
    required: false

  reset-gpios:
    type: phandle-array
    required: false
    description: Reset pin

  phys-rows:
    type: int
    required: false
    default: 4